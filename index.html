<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curio</title>
  <style>
    /* ===== RESET AND BASE ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg:       #FDF8F2;
      --color-surface:  #FFFFFF;
      --color-text:     #1E1E2E;
      --color-muted:    #6B7280;
      --color-border:   #E5E7EB;
      --color-accent:   #4F8FD9;
      --color-correct:  #22C55E;
      --color-wrong:    #EF4444;
      --color-star:     #F59E0B;
      --radius-card:    16px;
      --radius-btn:     12px;
      --shadow-card:    0 2px 12px rgba(0,0,0,0.08);
      --transition:     0.25s ease;
      --font-base:      'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-base);
      font-size: 18px;
      line-height: 1.6;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
    }

    /* ===== FOCUS RINGS ===== */
    :focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ===== SCREENS ===== */
    .screen {
      display: none;
      min-height: 100dvh;
    }
    .screen.active {
      display: block;
    }

    /* ===== HUB SCREEN ===== */
    #screen-hub {
      padding: 24px 16px 48px;
      max-width: 760px;
      margin: 0 auto;
    }

    .hub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .hub-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--color-text);
    }

    .hub-title span {
      color: var(--color-accent);
    }

    .hub-subtitle {
      color: var(--color-muted);
      margin-top: 2px;
      font-size: 1rem;
    }

    .btn-gear {
      background: none;
      border: 2px solid var(--color-border);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--transition), background var(--transition);
      flex-shrink: 0;
    }
    .btn-gear:hover {
      border-color: var(--color-accent);
      background: #EBF4FF;
    }

    .lesson-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 500px) {
      .lesson-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .lesson-card {
      background: var(--color-surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 24px 20px 20px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      position: relative;
      overflow: hidden;
      text-align: left;
      width: 100%;
    }

    .lesson-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: var(--card-color, var(--color-accent));
    }

    .lesson-card:hover,
    .lesson-card:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.12);
      border-color: var(--card-color, var(--color-accent));
      outline: none;
    }

    .lesson-card:active {
      transform: translateY(-1px);
    }

    .card-emoji {
      font-size: 2.4rem;
      line-height: 1;
      margin-bottom: 12px;
      display: block;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .card-stars {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .card-stars .star {
      font-size: 1.1rem;
      color: #D1D5DB;
    }

    .card-stars .star.earned {
      color: var(--color-star);
    }

    .card-desc {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--color-muted);
      line-height: 1.5;
    }

    .card-badge {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--card-color, var(--color-accent));
      color: #fff;
      opacity: 0;
    }

    .card-badge.visible {
      opacity: 1;
    }

    /* ===== LESSON SCREEN ===== */
    #screen-lesson {
      display: none;
      flex-direction: column;
      min-height: 100dvh;
    }
    #screen-lesson.active {
      display: flex;
    }

    .lesson-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .btn-exit {
      background: none;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-btn);
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      white-space: nowrap;
    }
    .btn-exit:hover {
      border-color: var(--color-wrong);
      background: #FEF2F2;
      color: var(--color-wrong);
    }

    .progress-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-label {
      font-size: 0.75rem;
      color: var(--color-muted);
      font-weight: 600;
    }

    .progress-bar-bg {
      height: 8px;
      background: var(--color-border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--lesson-color, var(--color-accent));
      transition: width 0.4s ease;
    }

    .lesson-body {
      flex: 1;
      padding: 24px 20px 32px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }

    /* ===== CARD CONTENT ===== */
    .content-card {
      background: var(--color-surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 28px 24px;
      animation: slide-in 0.3s ease;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(32px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes slide-in-left {
      from { opacity: 0; transform: translateX(-32px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .content-card.going-back {
      animation: slide-in-left 0.3s ease;
    }

    .content-card-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--lesson-color, var(--color-accent));
      margin-bottom: 10px;
    }

    .content-card-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.25;
    }

    .content-card-body {
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--color-text);
    }

    /* ===== QUESTION CARD ===== */
    .question-card {
      background: var(--color-surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 28px 24px;
      animation: slide-in 0.3s ease;
    }

    .question-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    /* MCQ options */
    .mcq-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mcq-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-btn);
      cursor: pointer;
      background: var(--color-surface);
      text-align: left;
      font-size: 1rem;
      font-weight: 500;
      transition: border-color var(--transition), background var(--transition);
      min-height: 54px;
      width: 100%;
    }

    .mcq-option:hover:not(:disabled) {
      border-color: var(--lesson-color, var(--color-accent));
      background: #F0F7FF;
    }

    .mcq-option .opt-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition);
    }

    .mcq-option.selected {
      border-color: var(--lesson-color, var(--color-accent));
      background: #EBF4FF;
    }
    .mcq-option.selected .opt-letter {
      background: var(--lesson-color, var(--color-accent));
      color: #fff;
    }

    .mcq-option.correct {
      border-color: var(--color-correct);
      background: #F0FDF4;
      animation: flash-green 0.4s ease;
    }
    .mcq-option.correct .opt-letter {
      background: var(--color-correct);
      color: #fff;
    }

    .mcq-option.wrong {
      border-color: var(--color-wrong);
      background: #FEF2F2;
      animation: flash-red 0.4s ease;
    }
    .mcq-option.wrong .opt-letter {
      background: var(--color-wrong);
      color: #fff;
    }

    .mcq-option:disabled {
      cursor: default;
    }

    @keyframes flash-green {
      0%   { background: #BBF7D0; }
      100% { background: #F0FDF4; }
    }

    @keyframes flash-red {
      0%   { background: #FECACA; }
      100% { background: #FEF2F2; }
    }

    /* T/F buttons */
    .tf-options {
      display: flex;
      gap: 12px;
    }

    .tf-btn {
      flex: 1;
      padding: 16px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-btn);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--color-surface);
      transition: border-color var(--transition), background var(--transition);
      min-height: 56px;
    }

    .tf-btn:hover:not(:disabled) {
      border-color: var(--lesson-color, var(--color-accent));
      background: #EBF4FF;
    }

    .tf-btn.correct {
      border-color: var(--color-correct);
      background: #F0FDF4;
      color: #15803D;
      animation: flash-green 0.4s ease;
    }

    .tf-btn.wrong {
      border-color: var(--color-wrong);
      background: #FEF2F2;
      color: #DC2626;
      animation: flash-red 0.4s ease;
    }

    .tf-btn:disabled { cursor: default; }

    /* Match */
    .match-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
    }

    .match-col-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-item {
      padding: 12px 14px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-btn);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--color-surface);
      text-align: left;
      min-height: 52px;
      transition: border-color var(--transition), background var(--transition);
      width: 100%;
    }

    .match-item:hover:not(:disabled) {
      border-color: var(--lesson-color, var(--color-accent));
      background: #F0F7FF;
    }

    .match-item.selected {
      border-color: var(--lesson-color, var(--color-accent));
      background: #EBF4FF;
    }

    .match-item.paired {
      border-color: #93C5FD;
      background: #EFF6FF;
    }

    .match-item.correct {
      border-color: var(--color-correct);
      background: #F0FDF4;
    }

    .match-item.wrong {
      border-color: var(--color-wrong);
      background: #FEF2F2;
    }

    .match-item:disabled { cursor: default; }

    .match-check-btn {
      margin-top: 16px;
      width: 100%;
    }

    /* Feedback banner */
    .feedback-banner {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: var(--radius-btn);
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
    }

    .feedback-banner.show { display: block; }

    .feedback-banner.success {
      background: #F0FDF4;
      color: #15803D;
      border: 1.5px solid #86EFAC;
    }

    .feedback-banner.error {
      background: #FEF2F2;
      color: #DC2626;
      border: 1.5px solid #FECACA;
    }

    .explanation-text {
      margin-top: 10px;
      padding: 12px 16px;
      background: #FEFCE8;
      border: 1.5px solid #FDE68A;
      border-radius: var(--radius-btn);
      font-size: 0.9rem;
      color: #78350F;
      font-weight: 500;
      display: none;
    }

    .explanation-text.show { display: block; }

    /* ===== NAVIGATION BUTTONS ===== */
    .lesson-nav {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 14px 24px;
      border-radius: var(--radius-btn);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid transparent;
      transition: opacity var(--transition), transform var(--transition), background var(--transition), border-color var(--transition);
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--lesson-color, var(--color-accent));
      color: #fff;
      flex: 1;
    }

    .btn-primary:hover {
      opacity: 0.88;
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .btn-secondary {
      background: var(--color-surface);
      border-color: var(--color-border);
      color: var(--color-text);
      flex: 0 0 auto;
    }

    .btn-secondary:hover {
      border-color: var(--color-accent);
      background: #EBF4FF;
    }

    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* ===== QUIZ SCREEN ===== */
    #screen-quiz {
      display: none;
      flex-direction: column;
      min-height: 100dvh;
    }
    #screen-quiz.active {
      display: flex;
    }

    /* ===== SCORE SCREEN ===== */
    #screen-score {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100dvh;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    #screen-score.active {
      display: flex;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .score-content {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
    }

    .score-emoji {
      font-size: 4rem;
      margin-bottom: 12px;
    }

    .score-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .score-subtitle {
      color: var(--color-muted);
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .score-stars {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .score-star {
      font-size: 3rem;
      transition: transform 0.3s ease;
    }

    .score-star.earned {
      animation: pop-star 0.4s ease forwards;
    }

    @keyframes pop-star {
      0%   { transform: scale(0); }
      70%  { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .score-fraction {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .score-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* ===== MODAL (confirmation dialogs) ===== */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      background: var(--color-surface);
      border-radius: var(--radius-card);
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .modal-body {
      color: var(--color-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-danger {
      background: var(--color-wrong);
      color: #fff;
      flex: 1;
    }

    .btn-danger:hover {
      opacity: 0.88;
    }

    /* ===== UTILITIES ===== */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- ===== HUB SCREEN ===== -->
  <main id="screen-hub" class="screen active" role="main">
    <div class="hub-header">
      <div>
        <h1 class="hub-title">Curio<span>.</span></h1>
        <p class="hub-subtitle">Pick a lesson and start learning.</p>
      </div>
      <button class="btn-gear" id="btn-gear" aria-label="Settings">&#9881;&#65039;</button>
    </div>
    <div class="lesson-grid" id="lesson-grid" role="list" aria-label="Available lessons"></div>
  </main>

  <!-- ===== LESSON SCREEN ===== -->
  <section id="screen-lesson" class="screen" aria-label="Lesson">
    <header class="lesson-topbar">
      <button class="btn-exit" id="btn-exit-lesson" aria-label="Exit lesson">Exit</button>
      <div class="progress-wrap">
        <div class="progress-label" id="progress-label">Card 1 of 6</div>
        <div class="progress-bar-bg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill" style="width:0%"></div>
        </div>
      </div>
    </header>
    <div class="lesson-body" id="lesson-body">
      <!-- content injected by JS -->
    </div>
  </section>

  <!-- ===== QUIZ SCREEN ===== -->
  <section id="screen-quiz" class="screen" aria-label="Final quiz">
    <header class="lesson-topbar">
      <button class="btn-exit" id="btn-exit-quiz" aria-label="Exit quiz">Exit</button>
      <div class="progress-wrap">
        <div class="progress-label" id="quiz-progress-label">Question 1 of 5</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="quiz-progress-fill" style="width:0%"></div>
        </div>
      </div>
    </header>
    <div class="lesson-body" id="quiz-body">
      <!-- content injected by JS -->
    </div>
  </section>

  <!-- ===== SCORE SCREEN ===== -->
  <section id="screen-score" class="screen" aria-label="Your score">
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>
    <div class="score-content">
      <div class="score-emoji" id="score-emoji">&#127881;</div>
      <h2 class="score-title" id="score-title">You finished!</h2>
      <p class="score-subtitle" id="score-subtitle"></p>
      <div class="score-stars" id="score-stars" aria-label="Stars earned"></div>
      <div class="score-fraction" id="score-fraction"></div>
      <div class="score-actions">
        <button class="btn btn-primary" id="btn-score-replay" style="--lesson-color: var(--color-accent)">Try again</button>
        <button class="btn btn-secondary" id="btn-score-hub">Back to lessons</button>
      </div>
    </div>
  </section>

  <!-- ===== MODALS ===== -->
  <div class="modal-backdrop" id="modal-exit" role="dialog" aria-modal="true" aria-labelledby="modal-exit-title">
    <div class="modal">
      <h2 class="modal-title" id="modal-exit-title">Leave this lesson?</h2>
      <p class="modal-body">Your progress is saved. You can pick up where you left off.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-exit-cancel">Keep going</button>
        <button class="btn btn-danger" id="modal-exit-confirm">Leave</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-reset" role="dialog" aria-modal="true" aria-labelledby="modal-reset-title">
    <div class="modal">
      <h2 class="modal-title" id="modal-reset-title">Start fresh?</h2>
      <p class="modal-body">This will clear all your stars and progress. This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-reset-cancel">Cancel</button>
        <button class="btn btn-danger" id="modal-reset-confirm">Yes, reset</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // ADD NEW LESSONS HERE
    // ============================================================
    const LESSONS = [
      {
        id: "computers-01",
        title: "How Computers Work",

    // ============================================================
    // STORAGE ABSTRACTION
    // Swap this one object to migrate to Supabase. No other code
    // in this file touches localStorage directly.
    // ============================================================
    const Storage = {
      async load(key) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      },

      async save(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          // Storage quota exceeded or unavailable; fail silently for now.
        }
      },

      async clear(key) {
        try {
          localStorage.removeItem(key);
        } catch {
          // Unavailable; fail silently.
        }
      }
    };

    const PROGRESS_KEY = "curio.progress";

    // Default progress shape
    function emptyProgress() {
      return { completed: {}, inProgress: {} };
    }

    // ============================================================
    // APP STATE
    // ============================================================
    let progress = emptyProgress();

    // Active lesson session state
    let session = null;
    /*
      session shape:
      {
        lesson,           // reference to LESSONS entry
        step,             // current step index in the merged step list
        steps,            // ordered array of step descriptors
        wrongCount,       // wrong attempts on current question
        quizAnswers,      // array of booleans (quiz phase)
        quizIndex,        // current quiz question index
        phase,            // "lesson" | "quiz"
        goingBack         // animation flag
      }
    */

    // ============================================================
    // UTILITY: Fisher-Yates shuffle (returns a new array)
    // ============================================================
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ============================================================
    // SCREEN ROUTER
    // ============================================================
    const screens = {
      hub:   document.getElementById("screen-hub"),
      lesson: document.getElementById("screen-lesson"),
      quiz:  document.getElementById("screen-quiz"),
      score: document.getElementById("screen-score")
    };

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
    }

    // ============================================================
    // HUB RENDERING
    // ============================================================
    async function renderHub() {
      progress = (await Storage.load(PROGRESS_KEY)) || emptyProgress();
      const grid = document.getElementById("lesson-grid");
      grid.innerHTML = "";

      LESSONS.forEach(lesson => {
        const comp = progress.completed[lesson.id];
        const stars = comp ? comp.stars : 0;

        const btn = document.createElement("button");
        btn.className = "lesson-card";
        btn.setAttribute("role", "listitem");
        btn.setAttribute("aria-label", lesson.title + (stars ? ", " + stars + " star" + (stars !== 1 ? "s" : "") + " earned" : ""));
        btn.style.setProperty("--card-color", lesson.color);

        const starHTML = [1, 2, 3].map(n =>
          `<span class="star${n <= stars ? " earned" : ""}" aria-hidden="true">&#9733;</span>`
        ).join("");

        const inProg = progress.inProgress[lesson.id];
        const badgeLabel = comp ? "Completed" : (inProg ? "In progress" : "");

        btn.innerHTML = `
          <span class="card-emoji" aria-hidden="true">${lesson.emoji}</span>
          <div class="card-header">
            <span class="card-title">${lesson.title}</span>
            <div class="card-stars" aria-hidden="true">${starHTML}</div>
          </div>
          <p class="card-desc">${lesson.description}</p>
          ${badgeLabel ? `<span class="card-badge visible" style="background:${lesson.color}">${badgeLabel}</span>` : ""}
        `;

        btn.addEventListener("click", () => startLesson(lesson.id));
        grid.appendChild(btn);
      });

      showScreen("hub");
    }

    // ============================================================
    // BUILD STEP LIST for a lesson
    // Steps are either { type:"card", cardIndex } or
    // { type:"check", check } interleaved by afterCard value.
    // ============================================================
    function buildSteps(lesson) {
      const steps = [];
      for (let i = 0; i < lesson.cards.length; i++) {
        steps.push({ type: "card", cardIndex: i });
        const checksHere = lesson.checks.filter(c => c.afterCard === i);
        checksHere.forEach(c => steps.push({ type: "check", check: c }));
      }
      return steps;
    }

    // ============================================================
    // LESSON START / RESUME
    // ============================================================
    async function startLesson(lessonId) {
      progress = (await Storage.load(PROGRESS_KEY)) || emptyProgress();
      const lesson = LESSONS.find(l => l.id === lessonId);
      if (!lesson) return;

      const steps = buildSteps(lesson);
      const inProg = progress.inProgress[lessonId];
      const startStep = (inProg && typeof inProg.stepIndex === "number") ? inProg.stepIndex : 0;

      session = {
        lesson,
        step: Math.min(startStep, steps.length - 1),
        steps,
        wrongCount: 0,
        quizAnswers: [],
        quizIndex: 0,
        phase: "lesson",
        goingBack: false
      };

      applyLessonColor(lesson.color);
      renderLessonStep();
      showScreen("lesson");
    }

    function applyLessonColor(color) {
      document.documentElement.style.setProperty("--lesson-color", color);
    }

    // ============================================================
    // SAVE PROGRESS
    // ============================================================
    async function saveInProgress() {
      if (!session) return;
      progress.inProgress[session.lesson.id] = { stepIndex: session.step };
      await Storage.save(PROGRESS_KEY, progress);
    }

    async function saveCompleted(stars, score, total) {
      if (!session) return;
      const id = session.lesson.id;
      const prev = progress.completed[id];
      const bestScore = prev ? Math.max(prev.bestScore, score) : score;
      const bestStars = prev ? Math.max(prev.stars, stars) : stars;
      progress.completed[id] = { stars: bestStars, bestScore, completedAt: new Date().toISOString() };
      delete progress.inProgress[id];
      await Storage.save(PROGRESS_KEY, progress);
    }

    // ============================================================
    // LESSON STEP RENDERING
    // ============================================================
    function renderLessonStep() {
      if (!session) return;
      const { lesson, step, steps, goingBack } = session;
      const totalCards = lesson.cards.length;

      // Progress: count how many card steps have been passed
      const cardStepsDone = steps.slice(0, step + 1).filter(s => s.type === "card").length;
      const pct = Math.round((cardStepsDone / totalCards) * 100);

      const fill = document.getElementById("progress-bar-fill");
      const bar = document.getElementById("progress-bar-bg");
      const label = document.getElementById("progress-label");
      fill.style.width = pct + "%";
      bar.setAttribute("aria-valuenow", pct);
      label.textContent = "Card " + cardStepsDone + " of " + totalCards;

      const body = document.getElementById("lesson-body");
      const currentStep = steps[step];

      session.goingBack = false; // reset after use

      if (currentStep.type === "card") {
        renderContentCard(body, lesson, currentStep.cardIndex, goingBack);
      } else {
        renderCheckQuestion(body, lesson, currentStep.check, goingBack);
      }

      saveInProgress();
    }

    function renderContentCard(container, lesson, cardIndex, goingBack) {
      const card = lesson.cards[cardIndex];
      const isLast = cardIndex === lesson.cards.length - 1;
      const { step, steps } = session;
      const isFirstStep = step === 0;

      const div = document.createElement("div");
      div.className = "content-card" + (goingBack ? " going-back" : "");
      div.innerHTML = `
        <div class="content-card-label">${lesson.title}</div>
        <h2 class="content-card-title">${card.title}</h2>
        <div class="content-card-body">${card.body}</div>
      `;

      // Nav
      const nav = document.createElement("div");
      nav.className = "lesson-nav";

      if (!isFirstStep) {
        const back = document.createElement("button");
        back.className = "btn btn-secondary";
        back.textContent = "Back";
        back.addEventListener("click", () => goToPreviousStep());
        nav.appendChild(back);
      }

      const next = document.createElement("button");
      next.className = "btn btn-primary";
      next.textContent = isLast && step === steps.length - 1 ? "Take the quiz" : "Next";
      next.addEventListener("click", () => goToNextStep());
      nav.appendChild(next);

      container.innerHTML = "";
      container.appendChild(div);
      container.appendChild(nav);
    }

    function goToNextStep() {
      if (!session) return;
      session.wrongCount = 0;
      if (session.step < session.steps.length - 1) {
        session.step++;
        renderLessonStep();
      } else {
        startQuiz();
      }
    }

    function goToPreviousStep() {
      if (!session || session.step === 0) return;
      session.step--;
      session.goingBack = true;
      session.wrongCount = 0;
      renderLessonStep();
    }

    // ============================================================
    // KNOWLEDGE CHECK RENDERING
    // ============================================================
    function renderCheckQuestion(container, lesson, check, goingBack) {
      container.innerHTML = "";
      session.wrongCount = 0;

      const card = document.createElement("div");
      card.className = "question-card" + (goingBack ? " going-back" : "");

      card.innerHTML = `
        <div class="question-label">Knowledge check</div>
        <div class="question-text">${check.question}</div>
        <div class="question-body-area"></div>
        <div class="feedback-banner" id="feedback"></div>
        <div class="explanation-text" id="explanation">${check.explanation}</div>
      `;

      container.appendChild(card);

      const bodyArea = card.querySelector(".question-body-area");

      if (check.type === "mcq") {
        renderMCQ(bodyArea, check, () => goToNextStep());
      } else if (check.type === "tf") {
        renderTF(bodyArea, check, () => goToNextStep());
      } else if (check.type === "match") {
        renderMatch(bodyArea, check, () => goToNextStep());
      }
    }

    // ============================================================
    // MCQ COMPONENT
    // ============================================================
    function renderMCQ(container, question, onCorrect) {
      const shuffled = shuffle(question.options);
      const letters = ["A", "B", "C", "D"];
      let answered = false;

      const wrap = document.createElement("div");
      wrap.className = "mcq-options";

      shuffled.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "mcq-option";
        btn.dataset.id = opt.id;
        btn.innerHTML = `
          <span class="opt-letter">${letters[i]}</span>
          <span>${opt.text}</span>
        `;

        btn.addEventListener("click", () => {
          if (answered) return;

          const allBtns = wrap.querySelectorAll(".mcq-option");
          allBtns.forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");

          if (opt.correct) {
            answered = true;
            btn.classList.remove("selected");
            btn.classList.add("correct");
            allBtns.forEach(b => { b.disabled = true; });
            showFeedback(true, null);
            setTimeout(onCorrect, 900);
          } else {
            session.wrongCount++;
            btn.classList.remove("selected");
            btn.classList.add("wrong");
            if (session.wrongCount >= 2) {
              showFeedback(false, true);
              answered = true;
              const continueBtn = document.createElement("button");
              continueBtn.className = "btn btn-primary";
              continueBtn.style.marginTop = "16px";
              continueBtn.style.width = "100%";
              continueBtn.textContent = "Continue";
              continueBtn.addEventListener("click", onCorrect);
              container.appendChild(continueBtn);
              allBtns.forEach(b => { b.disabled = true; });
            } else {
              showFeedback(false, false);
              setTimeout(() => {
                btn.classList.remove("wrong");
                btn.disabled = false;
              }, 700);
            }
          }
        });

        wrap.appendChild(btn);
      });

      container.appendChild(wrap);
    }

    // ============================================================
    // TRUE / FALSE COMPONENT
    // ============================================================
    function renderTF(container, question, onCorrect) {
      let answered = false;
      const wrap = document.createElement("div");
      wrap.className = "tf-options";

      [{ label: "True", value: true }, { label: "False", value: false }].forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "tf-btn";
        btn.textContent = opt.label;

        btn.addEventListener("click", () => {
          if (answered) return;
          const isCorrect = opt.value === question.correct;
          const allBtns = wrap.querySelectorAll(".tf-btn");

          if (isCorrect) {
            answered = true;
            btn.classList.add("correct");
            allBtns.forEach(b => { b.disabled = true; });
            showFeedback(true, null);
            setTimeout(onCorrect, 900);
          } else {
            session.wrongCount++;
            btn.classList.add("wrong");
            if (session.wrongCount >= 2) {
              answered = true;
              showFeedback(false, true);
              allBtns.forEach(b => { b.disabled = true; });
              const continueBtn = document.createElement("button");
              continueBtn.className = "btn btn-primary";
              continueBtn.style.marginTop = "16px";
              continueBtn.style.width = "100%";
              continueBtn.textContent = "Continue";
              continueBtn.addEventListener("click", onCorrect);
              container.parentElement.appendChild(continueBtn);
            } else {
              showFeedback(false, false);
              setTimeout(() => {
                btn.classList.remove("wrong");
                btn.disabled = false;
              }, 700);
            }
          }
        });

        wrap.appendChild(btn);
      });

      container.appendChild(wrap);
    }

    // ============================================================
    // DRAG-TO-MATCH (click-to-select) COMPONENT
    // ============================================================
    function renderMatch(container, question, onCorrect) {
      const pairs = shuffle(question.pairs);
      const shuffledRights = shuffle(pairs.map(p => p.right));

      let selectedLeft = null;
      let selectedRight = null;
      const userPairs = {}; // left -> right

      const colsWrap = document.createElement("div");

      // Column headers
      const headers = document.createElement("div");
      headers.className = "match-columns";
      headers.innerHTML = `
        <div class="match-col-label">Item</div>
        <div class="match-col-label">Description</div>
      `;
      colsWrap.appendChild(headers);

      const cols = document.createElement("div");
      cols.className = "match-columns";

      const leftCol = document.createElement("div");
      leftCol.className = "match-col";

      const rightCol = document.createElement("div");
      rightCol.className = "match-col";

      pairs.forEach(pair => {
        const btn = document.createElement("button");
        btn.className = "match-item";
        btn.textContent = pair.left;
        btn.dataset.left = pair.left;

        btn.addEventListener("click", () => {
          if (btn.disabled) return;

          // Clicking a paired left item unpairs it
          if (userPairs[pair.left]) {
            delete userPairs[pair.left];
            btn.classList.remove("paired");
            updateRightPairedStates();
          }

          if (selectedLeft === btn) {
            btn.classList.remove("selected");
            selectedLeft = null;
          } else {
            if (selectedLeft) selectedLeft.classList.remove("selected");
            selectedLeft = btn;
            btn.classList.add("selected");

            if (selectedRight) {
              const rVal = selectedRight.dataset.right;
              // Remove existing pair for this right
              for (const k in userPairs) {
                if (userPairs[k] === rVal) {
                  delete userPairs[k];
                  leftCol.querySelector(`[data-left="${k}"]`).classList.remove("paired");
                }
              }
              userPairs[pair.left] = rVal;
              btn.classList.remove("selected");
              btn.classList.add("paired");
              selectedRight.classList.remove("selected");
              selectedRight.classList.add("paired");
              selectedLeft = null;
              selectedRight = null;
            }
          }
        });

        leftCol.appendChild(btn);
      });

      shuffledRights.forEach(rightText => {
        const btn = document.createElement("button");
        btn.className = "match-item";
        btn.textContent = rightText;
        btn.dataset.right = rightText;

        btn.addEventListener("click", () => {
          if (btn.disabled) return;

          if (selectedRight === btn) {
            btn.classList.remove("selected");
            selectedRight = null;
          } else {
            if (selectedRight) selectedRight.classList.remove("selected");
            selectedRight = btn;
            btn.classList.add("selected");

            if (selectedLeft) {
              const lVal = selectedLeft.dataset.left;
              const rVal = rightText;

              // Remove existing pair for this right
              for (const k in userPairs) {
                if (userPairs[k] === rVal) {
                  delete userPairs[k];
                  leftCol.querySelector(`[data-left="${k}"]`).classList.remove("paired");
                }
              }
              // Remove existing pair for this left
              if (userPairs[lVal]) {
                const oldRight = userPairs[lVal];
                rightCol.querySelector(`[data-right="${oldRight}"]`).classList.remove("paired");
              }

              userPairs[lVal] = rVal;
              selectedLeft.classList.remove("selected");
              selectedLeft.classList.add("paired");
              btn.classList.remove("selected");
              btn.classList.add("paired");
              selectedLeft = null;
              selectedRight = null;
            }
          }
        });

        rightCol.appendChild(btn);
      });

      function updateRightPairedStates() {
        const pairedRights = new Set(Object.values(userPairs));
        rightCol.querySelectorAll(".match-item").forEach(b => {
          if (pairedRights.has(b.dataset.right)) {
            b.classList.add("paired");
          } else {
            b.classList.remove("paired");
          }
        });
      }

      cols.appendChild(leftCol);
      cols.appendChild(rightCol);
      colsWrap.appendChild(cols);

      // Check button
      const checkBtn = document.createElement("button");
      checkBtn.className = "btn btn-primary match-check-btn";
      checkBtn.textContent = "Check my answers";

      checkBtn.addEventListener("click", () => {
        if (Object.keys(userPairs).length < pairs.length) {
          showFeedback(false, false, "Match all items before checking.");
          return;
        }

        let allCorrect = true;
        pairs.forEach(pair => {
          const leftBtn = leftCol.querySelector(`[data-left="${pair.left}"]`);
          const rightVal = userPairs[pair.left];
          const rightBtn = rightCol.querySelector(`[data-right="${rightVal}"]`);
          const isCorrect = rightVal === pair.right;

          if (!isCorrect) allCorrect = false;

          leftBtn.classList.remove("paired");
          rightBtn.classList.remove("paired");
          leftBtn.classList.add(isCorrect ? "correct" : "wrong");
          rightBtn.classList.add(isCorrect ? "correct" : "wrong");
          leftBtn.disabled = true;
          rightBtn.disabled = true;
        });

        checkBtn.disabled = true;

        if (allCorrect) {
          showFeedback(true, null);
          setTimeout(onCorrect, 1000);
        } else {
          session.wrongCount++;
          if (session.wrongCount >= 2) {
            showFeedback(false, true);
            const continueBtn = document.createElement("button");
            continueBtn.className = "btn btn-primary";
            continueBtn.style.marginTop = "16px";
            continueBtn.style.width = "100%";
            continueBtn.textContent = "Continue";
            continueBtn.addEventListener("click", onCorrect);
            colsWrap.parentElement.appendChild(continueBtn);
          } else {
            showFeedback(false, false);
            // Reset for another try
            setTimeout(() => {
              pairs.forEach(pair => {
                const leftBtn = leftCol.querySelector(`[data-left="${pair.left}"]`);
                const rightVal = userPairs[pair.left];
                const rightBtn = rightCol.querySelector(`[data-right="${rightVal}"]`);
                leftBtn.classList.remove("wrong", "correct");
                rightBtn.classList.remove("wrong", "correct");
                leftBtn.disabled = false;
                rightBtn.disabled = false;
              });
              for (const k in userPairs) delete userPairs[k];
              checkBtn.disabled = false;
              selectedLeft = null;
              selectedRight = null;
            }, 1200);
          }
        }
      });

      colsWrap.appendChild(checkBtn);
      container.appendChild(colsWrap);
    }

    // ============================================================
    // FEEDBACK HELPER
    // ============================================================
    const CORRECT_MESSAGES = ["Yes! Nice work.", "That is right!", "Great thinking!", "Exactly right."];
    const WRONG_MESSAGES   = ["Not quite. Try again.", "Give it another go.", "Almost. Try once more."];

    function showFeedback(correct, showExplanation, customMsg) {
      const banner = document.getElementById("feedback");
      const expl   = document.getElementById("explanation");

      if (!banner) return;

      if (correct) {
        const msg = customMsg || CORRECT_MESSAGES[Math.floor(Math.random() * CORRECT_MESSAGES.length)];
        banner.textContent = msg;
        banner.className = "feedback-banner show success";
      } else {
        const msg = customMsg || WRONG_MESSAGES[Math.floor(Math.random() * WRONG_MESSAGES.length)];
        banner.textContent = msg;
        banner.className = "feedback-banner show error";
      }

      if (showExplanation && expl) {
        expl.classList.add("show");
      }
    }

    // ============================================================
    // QUIZ PHASE
    // ============================================================
    function startQuiz() {
      if (!session) return;
      session.phase = "quiz";
      session.quizIndex = 0;
      session.quizAnswers = [];
      applyLessonColor(session.lesson.color);
      renderQuizQuestion();
      showScreen("quiz");
    }

    function renderQuizQuestion() {
      if (!session) return;
      const { lesson, quizIndex } = session;
      const quiz = lesson.quiz;
      const q = quiz[quizIndex];
      const total = quiz.length;

      const label = document.getElementById("quiz-progress-label");
      const fill  = document.getElementById("quiz-progress-fill");
      label.textContent = "Question " + (quizIndex + 1) + " of " + total;
      fill.style.width = Math.round((quizIndex / total) * 100) + "%";

      const body = document.getElementById("quiz-body");
      body.innerHTML = "";
      session.wrongCount = 0;

      const card = document.createElement("div");
      card.className = "question-card";
      card.innerHTML = `
        <div class="question-label">Final quiz</div>
        <div class="question-text">${q.question}</div>
        <div class="question-body-area"></div>
        <div class="feedback-banner" id="feedback"></div>
        <div class="explanation-text" id="explanation">${q.explanation}</div>
      `;
      body.appendChild(card);

      const bodyArea = card.querySelector(".question-body-area");
      const onAnswered = (correct) => {
        session.quizAnswers.push(correct);
        setTimeout(() => {
          if (quizIndex + 1 < total) {
            session.quizIndex++;
            renderQuizQuestion();
          } else {
            showScore();
          }
        }, correct ? 900 : 1400);
      };

      if (q.type === "mcq") {
        renderQuizMCQ(bodyArea, q, onAnswered);
      } else if (q.type === "tf") {
        renderQuizTF(bodyArea, q, onAnswered);
      } else if (q.type === "match") {
        renderQuizMatch(bodyArea, q, onAnswered);
      }
    }

    // Quiz variants track per-question correctness
    function renderQuizMCQ(container, question, onAnswered) {
      const shuffled = shuffle(question.options);
      const letters = ["A", "B", "C", "D"];
      let answered = false;

      const wrap = document.createElement("div");
      wrap.className = "mcq-options";

      shuffled.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "mcq-option";
        btn.dataset.id = opt.id;
        btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt.text}</span>`;

        btn.addEventListener("click", () => {
          if (answered) return;
          const allBtns = wrap.querySelectorAll(".mcq-option");
          allBtns.forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");

          if (opt.correct) {
            answered = true;
            btn.classList.remove("selected");
            btn.classList.add("correct");
            allBtns.forEach(b => { b.disabled = true; });
            showFeedback(true, null);
            onAnswered(true);
          } else {
            session.wrongCount++;
            btn.classList.remove("selected");
            btn.classList.add("wrong");
            if (session.wrongCount >= 2) {
              answered = true;
              allBtns.forEach(b => { b.disabled = true; });
              showFeedback(false, true);
              onAnswered(false);
            } else {
              showFeedback(false, false);
              setTimeout(() => {
                btn.classList.remove("wrong");
                btn.disabled = false;
              }, 700);
            }
          }
        });

        wrap.appendChild(btn);
      });

      container.appendChild(wrap);
    }

    function renderQuizTF(container, question, onAnswered) {
      let answered = false;
      const wrap = document.createElement("div");
      wrap.className = "tf-options";

      [{ label: "True", value: true }, { label: "False", value: false }].forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "tf-btn";
        btn.textContent = opt.label;

        btn.addEventListener("click", () => {
          if (answered) return;
          const isCorrect = opt.value === question.correct;
          const allBtns = wrap.querySelectorAll(".tf-btn");

          if (isCorrect) {
            answered = true;
            btn.classList.add("correct");
            allBtns.forEach(b => { b.disabled = true; });
            showFeedback(true, null);
            onAnswered(true);
          } else {
            session.wrongCount++;
            btn.classList.add("wrong");
            if (session.wrongCount >= 2) {
              answered = true;
              allBtns.forEach(b => { b.disabled = true; });
              showFeedback(false, true);
              onAnswered(false);
            } else {
              showFeedback(false, false);
              setTimeout(() => {
                btn.classList.remove("wrong");
                btn.disabled = false;
              }, 700);
            }
          }
        });

        wrap.appendChild(btn);
      });

      container.appendChild(wrap);
    }

    function renderQuizMatch(container, question, onAnswered) {
      const pairs = shuffle(question.pairs);
      const shuffledRights = shuffle(pairs.map(p => p.right));
      let selectedLeft = null;
      let selectedRight = null;
      const userPairs = {};

      const colsWrap = document.createElement("div");

      const headers = document.createElement("div");
      headers.className = "match-columns";
      headers.innerHTML = `<div class="match-col-label">Item</div><div class="match-col-label">Description</div>`;
      colsWrap.appendChild(headers);

      const cols = document.createElement("div");
      cols.className = "match-columns";

      const leftCol = document.createElement("div");
      leftCol.className = "match-col";
      const rightCol = document.createElement("div");
      rightCol.className = "match-col";

      function makePairHandler(leftBtn, rightBtn, leftKey, rightVal) {
        for (const k in userPairs) {
          if (userPairs[k] === rightVal) {
            delete userPairs[k];
            leftCol.querySelector(`[data-left="${k}"]`).classList.remove("paired");
          }
        }
        if (userPairs[leftKey]) {
          const oldRight = userPairs[leftKey];
          rightCol.querySelector(`[data-right="${oldRight}"]`).classList.remove("paired");
        }
        userPairs[leftKey] = rightVal;
        leftBtn.classList.remove("selected");
        leftBtn.classList.add("paired");
        rightBtn.classList.remove("selected");
        rightBtn.classList.add("paired");
        selectedLeft = null;
        selectedRight = null;
      }

      pairs.forEach(pair => {
        const btn = document.createElement("button");
        btn.className = "match-item";
        btn.textContent = pair.left;
        btn.dataset.left = pair.left;

        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          if (userPairs[pair.left]) {
            delete userPairs[pair.left];
            btn.classList.remove("paired");
          }
          if (selectedLeft === btn) {
            btn.classList.remove("selected");
            selectedLeft = null;
          } else {
            if (selectedLeft) selectedLeft.classList.remove("selected");
            selectedLeft = btn;
            btn.classList.add("selected");
            if (selectedRight) {
              makePairHandler(btn, selectedRight, pair.left, selectedRight.dataset.right);
            }
          }
        });

        leftCol.appendChild(btn);
      });

      shuffledRights.forEach(rightText => {
        const btn = document.createElement("button");
        btn.className = "match-item";
        btn.textContent = rightText;
        btn.dataset.right = rightText;

        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          if (selectedRight === btn) {
            btn.classList.remove("selected");
            selectedRight = null;
          } else {
            if (selectedRight) selectedRight.classList.remove("selected");
            selectedRight = btn;
            btn.classList.add("selected");
            if (selectedLeft) {
              makePairHandler(selectedLeft, btn, selectedLeft.dataset.left, rightText);
            }
          }
        });

        rightCol.appendChild(btn);
      });

      cols.appendChild(leftCol);
      cols.appendChild(rightCol);
      colsWrap.appendChild(cols);

      const checkBtn = document.createElement("button");
      checkBtn.className = "btn btn-primary match-check-btn";
      checkBtn.textContent = "Check my answers";

      checkBtn.addEventListener("click", () => {
        if (Object.keys(userPairs).length < pairs.length) {
          showFeedback(false, false, "Match all items before checking.");
          return;
        }
        let allCorrect = true;
        pairs.forEach(pair => {
          const leftBtn = leftCol.querySelector(`[data-left="${pair.left}"]`);
          const rightVal = userPairs[pair.left];
          const rightBtn = rightCol.querySelector(`[data-right="${rightVal}"]`);
          const isCorrect = rightVal === pair.right;
          if (!isCorrect) allCorrect = false;
          leftBtn.classList.remove("paired");
          rightBtn.classList.remove("paired");
          leftBtn.classList.add(isCorrect ? "correct" : "wrong");
          rightBtn.classList.add(isCorrect ? "correct" : "wrong");
          leftBtn.disabled = true;
          rightBtn.disabled = true;
        });
        checkBtn.disabled = true;

        if (allCorrect) {
          showFeedback(true, null);
          onAnswered(true);
        } else {
          session.wrongCount++;
          if (session.wrongCount >= 2) {
            showFeedback(false, true);
            onAnswered(false);
          } else {
            showFeedback(false, false);
            setTimeout(() => {
              pairs.forEach(pair => {
                const leftBtn = leftCol.querySelector(`[data-left="${pair.left}"]`);
                const rightVal = userPairs[pair.left];
                const rightBtn = rightCol.querySelector(`[data-right="${rightVal}"]`);
                leftBtn.classList.remove("wrong", "correct");
                rightBtn.classList.remove("wrong", "correct");
                leftBtn.disabled = false;
                rightBtn.disabled = false;
              });
              for (const k in userPairs) delete userPairs[k];
              checkBtn.disabled = false;
              selectedLeft = null;
              selectedRight = null;
            }, 1200);
          }
        }
      });

      colsWrap.appendChild(checkBtn);
      container.appendChild(colsWrap);
    }

    // ============================================================
    // SCORE SCREEN
    // ============================================================
    async function showScore() {
      if (!session) return;

      const answers = session.quizAnswers;
      const total   = answers.length;
      const score   = answers.filter(Boolean).length;
      const pct     = total > 0 ? score / total : 0;
      const stars   = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : 1;

      await saveCompleted(stars, score, total);

      const emoji    = document.getElementById("score-emoji");
      const title    = document.getElementById("score-title");
      const subtitle = document.getElementById("score-subtitle");
      const starsEl  = document.getElementById("score-stars");
      const fraction = document.getElementById("score-fraction");

      emoji.textContent = stars === 3 ? "🎉" : stars === 2 ? "🌟" : "💪";
      title.textContent = stars === 3 ? "Amazing work!" : stars === 2 ? "Well done!" : "You finished!";
      subtitle.textContent = session.lesson.title;
      fraction.textContent = score + " out of " + total + " correct";

      starsEl.innerHTML = "";
      for (let i = 1; i <= 3; i++) {
        const s = document.createElement("span");
        s.className = "score-star" + (i <= stars ? " earned" : "");
        s.setAttribute("aria-label", i <= stars ? "star earned" : "star not earned");
        s.textContent = "★";
        s.style.color = i <= stars ? "var(--color-star)" : "#D1D5DB";
        if (i <= stars) s.style.animationDelay = (i * 0.15) + "s";
        starsEl.appendChild(s);
      }

      document.getElementById("btn-score-replay").style.setProperty("--lesson-color", session.lesson.color);

      showScreen("score");
      if (stars >= 2) startConfetti();
    }

    // ============================================================
    // CONFETTI (canvas-based, no library)
    // ============================================================
    let confettiAnimId = null;

    function startConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx    = canvas.getContext("2d");

      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;

      const COLORS = ["#4F8FD9", "#22C55E", "#F59E0B", "#EF4444", "#A78BFA", "#FB923C"];
      const particles = Array.from({ length: 120 }, () => ({
        x:  Math.random() * canvas.width,
        y:  Math.random() * -canvas.height,
        w:  6 + Math.random() * 8,
        h:  10 + Math.random() * 6,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        vx: (Math.random() - 0.5) * 2.5,
        vy: 2 + Math.random() * 3,
        angle:  Math.random() * Math.PI * 2,
        spin:   (Math.random() - 0.5) * 0.15
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
          p.x     += p.vx;
          p.y     += p.vy;
          p.angle += p.spin;
          if (p.y > canvas.height + 20) {
            p.y  = -20;
            p.x  = Math.random() * canvas.width;
          }
        });
        confettiAnimId = requestAnimationFrame(draw);
      }

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      draw();

      setTimeout(() => {
        if (confettiAnimId) {
          cancelAnimationFrame(confettiAnimId);
          confettiAnimId = null;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }, 5000);
    }

    // ============================================================
    // EXIT CONFIRMATION
    // ============================================================
    function showExitModal(onConfirm) {
      const backdrop = document.getElementById("modal-exit");
      backdrop.classList.add("show");
      document.getElementById("modal-exit-cancel").focus();

      const cancel  = document.getElementById("modal-exit-cancel");
      const confirm = document.getElementById("modal-exit-confirm");

      function cleanup() {
        backdrop.classList.remove("show");
        cancel.replaceWith(cancel.cloneNode(true));
        confirm.replaceWith(confirm.cloneNode(true));
      }

      document.getElementById("modal-exit-cancel").addEventListener("click", cleanup, { once: true });
      document.getElementById("modal-exit-confirm").addEventListener("click", () => {
        cleanup();
        onConfirm();
      }, { once: true });
    }

    // ============================================================
    // EVENT WIRING
    // ============================================================
    document.getElementById("btn-exit-lesson").addEventListener("click", () => {
      showExitModal(() => {
        session = null;
        renderHub();
      });
    });

    document.getElementById("btn-exit-quiz").addEventListener("click", () => {
      showExitModal(() => {
        session = null;
        renderHub();
      });
    });

    document.getElementById("btn-score-hub").addEventListener("click", () => {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
        const canvas = document.getElementById("confetti-canvas");
        canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
      }
      session = null;
      renderHub();
    });

    document.getElementById("btn-score-replay").addEventListener("click", () => {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
        const canvas = document.getElementById("confetti-canvas");
        canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
      }
      const lessonId = session ? session.lesson.id : null;
      session = null;
      if (lessonId) {
        delete progress.inProgress[lessonId];
        Storage.save(PROGRESS_KEY, progress).then(() => startLesson(lessonId));
      }
    });

    // Gear / reset
    document.getElementById("btn-gear").addEventListener("click", () => {
      const backdrop = document.getElementById("modal-reset");
      backdrop.classList.add("show");
      document.getElementById("modal-reset-cancel").focus();

      const cancel  = document.getElementById("modal-reset-cancel");
      const confirm = document.getElementById("modal-reset-confirm");

      function cleanup() {
        backdrop.classList.remove("show");
        cancel.replaceWith(cancel.cloneNode(true));
        confirm.replaceWith(confirm.cloneNode(true));
      }

      document.getElementById("modal-reset-cancel").addEventListener("click", cleanup, { once: true });
      document.getElementById("modal-reset-confirm").addEventListener("click", async () => {
        cleanup();
        await Storage.clear(PROGRESS_KEY);
        progress = emptyProgress();
        renderHub();
      }, { once: true });
    });

    // Close modals on backdrop click
    ["modal-exit", "modal-reset"].forEach(id => {
      document.getElementById(id).addEventListener("click", function(e) {
        if (e.target === this) {
          this.classList.remove("show");
        }
      });
    });

    // Keyboard: close modal on Escape
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        document.querySelectorAll(".modal-backdrop.show").forEach(m => m.classList.remove("show"));
      }
    });

    // ============================================================
    // INIT
    // ============================================================
    renderHub();
  </script>
</body>
